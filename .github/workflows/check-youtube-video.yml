name: Check YouTube Video Metadata

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'YouTube video ID to inspect (the part after ?v= in the URL)'
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch actual stored title/description (read-only)
        run: node scripts/check-youtube-video.js
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
