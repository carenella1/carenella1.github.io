name: Fix Existing Videos (one-time)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild and replace the videos
        run: node scripts/fix-existing-videos.js
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Commit updated article pages and rotation state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add articles/ content/image-rotation.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix existing videos: rebuild with corrected zoom, replace on YouTube"
            git push
          fi
