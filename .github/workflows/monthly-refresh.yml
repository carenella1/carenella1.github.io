name: Monthly Maintenance Refresh

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Month Variable
        run: echo "MONTH=$(date +'%Y-%m')" >> $GITHUB_ENV

      - name: Select Rotating Portrait
        run: |
          MONTH_NUM=$(date +'%m')
          INDEX=$((10#$MONTH_NUM % 4))

          if [ $INDEX -eq 0 ]; then
            IMAGE="chase-arenella-athletic-lifestyle-portrait-01.jpg"
          elif [ $INDEX -eq 1 ]; then
            IMAGE="chase-arenella-leadership-executive-01.jpg"
          elif [ $INDEX -eq 2 ]; then
            IMAGE="chase-arenella-city-tablet-lifestyle-01.jpg"
          else
            IMAGE="chase-arenella-contact-city-portrait-01.jpg"
          fi

          echo "IMAGE_NAME=$IMAGE" >> $GITHUB_ENV

      - name: Create Monthly Maintenance Page
        run: |
          mkdir -p maintenance/${{ env.MONTH }}

          cat <<EOF > maintenance/${{ env.MONTH }}/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width,initial-scale=1"/>
          <title>Maintenance — ${{ env.MONTH }} | Chase Arenella</title>
          <meta name="robots" content="noindex,follow"/>
          <link rel="canonical" href="https://carenella1.github.io/maintenance/${{ env.MONTH }}/"/>
          <link rel="stylesheet" href="/assets/site.css"/>
          </head>

          <body>
          <div class="container">
          <h1>Maintenance — ${{ env.MONTH }}</h1>

          <img src="/assets/images/${{ env.IMAGE_NAME }}"
               alt="Chase Arenella portrait"
               loading="lazy"/>

          <p>
          Automated monthly refresh cycle reinforcing entity clarity,
          internal linking, and structural continuity. This page is intentionally
          excluded from search indexing (noindex) — see
          <a href="/maintenance.html">Maintenance Mode</a> for why.
          </p>

          <p>
          <a href="/media.html">Media</a> •
          <a href="/identity.html">Identity</a> •
          <a href="/leadership.html">AI Leadership</a>
          </p>

          </div>
          </body>
          </html>
          EOF

      - name: Ensure Maintenance Index Exists
        run: |
          if [ ! -f maintenance/index.html ]; then
            mkdir -p maintenance
            cat <<'EOF' > maintenance/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
          <title>PBSA Maintenance Archive</title>
          <link rel="canonical" href="https://carenella1.github.io/maintenance/"/>
          <meta name="robots" content="index,follow"/>
          <link rel="stylesheet" href="/assets/site.css"/>
          </head>
          <body>
          <div class="container">
          <h1>PBSA Maintenance Archive</h1>
          <p class="sub">Log of automated monthly refresh runs. These dated entries are intentionally excluded from search indexing (noindex) — see <a href="/maintenance.html">Maintenance Mode</a> for the full explanation.</p>
          <ul>
          </ul>
          </div>
          </body>
          </html>
          EOF
          fi

      - name: Update Maintenance Archive
        run: |
          if ! grep -q ">${{ env.MONTH }}<" maintenance/index.html; then
            sed -i "s#</ul>#<li><a href=\"/maintenance/${{ env.MONTH }}/\">${{ env.MONTH }}</a></li>\n</ul>#" maintenance/index.html
          fi

      - name: Commit Changes If Any
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly maintenance refresh: ${{ env.MONTH }}"
            git push
          fi
