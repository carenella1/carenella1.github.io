name: PBSA Monthly Maintenance

on:
  schedule:
    - cron: "12 17 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run maintenance script
        run: node scripts/monthly-refresh.js

      - name: Commit and Push
        run: |
          git config user.name "pbsa-bot"
          git config user.email "pbsa-bot@users.noreply.github.com"
          git add -A
          git commit -m "Automated monthly maintenance refresh" || exit 0
          git push
