name: Retitle YouTube Videos

# Manual only. Updates existing videos' titles/descriptions/tags to the
# current name-first format (scripts/retitle-youtube-videos.js). Run once
# with "apply" unticked to preview, then again with it ticked.
# Needs YT_REFRESH_TOKEN issued with the youtube.force-ssl scope.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually update YouTube (leave unticked for a dry run)"
        type: boolean
        default: false

jobs:
  retitle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Retitle videos
        run: node scripts/retitle-youtube-videos.js ${{ inputs.apply && '--apply' || '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
